

- type: custom-api
  title: System Monitor
  cache: 1s
  url: ${GLANCES_URL}/api/4/system
  options:
    base_url:    ${GLANCES_URL}
    net_iface:   "enp5s0"
    disk_mounts: "^(/root|/4TB|/Toshiba|/Hitachi)$"   # regex, несколько через |
  template: |
    {{ $base     := .Options.StringOr "base_url"  "http://localhost:61208" }}
    {{ $netIface := .Options.StringOr "net_iface" "enp5s0" }}

    {{ $cpu    := newRequest (printf "%s/api/4/cpu"     $base) | getResponse }}
    {{ $mem    := newRequest (printf "%s/api/4/mem"     $base) | getResponse }}
    {{ $swap   := newRequest (printf "%s/api/4/memswap" $base) | getResponse }}
    {{ $load   := newRequest (printf "%s/api/4/load"    $base) | getResponse }}
    {{ $fs     := newRequest (printf "%s/api/4/fs"      $base) | getResponse }}
    {{ $net    := newRequest (printf "%s/api/4/network" $base) | getResponse }}
    {{ $diskio := newRequest (printf "%s/api/4/diskio"  $base) | getResponse }}
    {{ $uptime := newRequest (printf "%s/api/4/uptime"  $base) | getResponse }}

    {{/* CPU Calculations */}}
    {{ $cpuPct    := $cpu.JSON.Float "total" }}
    {{ $cores     := $load.JSON.Int  "cpucore" }}
    {{ $load1     := $load.JSON.Float "min1" }}
    {{ $load15    := $load.JSON.Float "min15" }}
    
    {{ $load1pct  := 0 }}
    {{ $load15pct := 0 }}
    {{ if gt $cores 0 }}
      {{ $load1pct = div (mul $load1 100) $cores }}
      {{ $load15pct = div (mul $load15 100) $cores }}
    {{ end }}

    {{ $memPct    := $mem.JSON.Float  "percent" }}
    {{ $memUsedGB := div ($mem.JSON.Int  "used")  1073741824 }}
    {{ $memTotGB  := div ($mem.JSON.Int  "total") 1073741824 }}
    
    {{ $swapPct   := $swap.JSON.Float "percent" }}
    {{ $swapUsedMB := div ($swap.JSON.Int "used")  1048576 }}
    {{ $swapTotGB  := div ($swap.JSON.Int "total") 1073741824 }}

    {{/* Network Calculations */}}
    {{ $netRx := 0 }}
    {{ $netTx := 0 }}
    {{ range $net.JSON.Array "" }}
      {{ if eq (.String "interface_name") $netIface }}
        {{ $netRx = .Int "bytes_recv_rate_per_sec" }}
        {{ $netTx = .Int "bytes_sent_rate_per_sec" }}
      {{ end }}
    {{ end }}
    
    {{ $rxKB := div $netRx 1024 }}
    {{ $txKB := div $netTx 1024 }}
    {{ $rxMB := div $rxKB 1024 }}
    {{ $txMB := div $txKB 1024 }}

        <style>
      /* Вертикальные бары */
      .v-bars-row {
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        height: 50px;
        gap: 4px;
      }
      .v-bar-col {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 12%;
        height: 100%;
        justify-content: flex-end;
      }
      .v-bar-track {
        width: 2rem;
        height: 100%;
        background-color: var(--color-bg-alt);
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }
      .v-bar-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: var(--color-progress-value);
        border-radius: 0 var(--half-border-radius) var(--half-border-radius) 0;
      }
      .v-bar-label {
        font-size: 9px;
        margin-top: 4px;
        color: var(--color-text-dim);
        text-align: center;
      }


      .stat-item {
        display: flex;
        flex-direction: row;
        align-items: flex-end;
        gap: 5px;
      }
      .stat-label {
        display: flex;
        flex-direction: column;
        height: 100%;
        justify-content: space-between;
      }

      .v-bars-row{
        height: 100%;
      }
      .v-bar-track{
        border: 1px solid var(--color-progress-border);
      }
      </style>
    
    <div class="server">

      {{/* Header */}}
      <div class="server-info">
        <div class="server-detail" data-popover-type="html" data-popover-margin="0.2rem" data-popover-max-width="300px">
          <div data-popover-html="">
            <div class="size-h5 text-compact">PLATFORM</div>
            <div class="color-highlight">{{ .JSON.String "os_name" }}</div>
            <div class="flex margin-top-3">
              <div class="size-h5">UPTIME</div>
              <div class="value-separator"></div>
              <div class="color-highlight">{{ $uptime.JSON.String "" }}</div>
            </div>
          </div>
          <div>
            <div class="server-name color-highlight size-h3">{{ .JSON.String "hostname" }}</div>
            <div>{{ $uptime.JSON.String "" }} uptime</div>
          </div>
        </div>
        <div class="shrink-0" data-popover-type="html" data-popover-margin="0.2rem" data-popover-max-width="400px">
            <div data-popover-html="">
                <div class="size-h5 text-compact">PLATFORM</div>
                <div class="color-highlight">alpine</div>
            </div>
            <svg class="server-icon" stroke="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" style="margin-right:8px">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 17.25v-.228a4.5 4.5 0 0 0-.12-1.03l-2.268-9.64a3.375 3.375 0 0 0-3.285-2.602H7.923a3.375 3.375 0 0 0-3.285 2.602l-2.268 9.64a4.5 4.5 0 0 0-.12 1.03v.228m19.5 0a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3m19.5 0a3 3 0 0 0-3-3H5.25a3 3 0 0 0-3 3m16.5 0h.008v.008h-.008v-.008Zm-3 0h.008v.008h-.008v-.008Z" />
            </svg>
        </div>
      </div>

      {{/* Stats Row 1: CPU, RAM, NET */}}
    <div class="server-stats-disks">
        <div class="server-stats" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(min-content, 40px)); margin-buttom: 10px;">

            {{/* CPU */}}
            <div class="stat-item">
              <div class="v-bars-row">
                <div class="v-bar-col">
                  <div class="v-bar-track">
                    <div class="v-bar-fill" style="height:{{ printf "%.0f" $cpuPct }}%"></div>
                  </div>
                </div>
              </div>
              <div class="stat-label color-highlight">
                <div class="size-title-dynamic">CPU</div>
                <div class="size-h4">{{ printf "%.0f" $cpuPct }}%</div>
              </div>
            </div>

            {{/* RAM */}}
            <div class="stat-item">
              <div class="v-bars-row">
                <div class="v-bar-col">
                  <div class="v-bar-track">
                    <div class="v-bar-fill" style="height:{{ printf "%.0f" $memPct }}%"></div>
                  </div>
                </div>
              </div>
              <div class="stat-label color-highlight">
                <div class="size-title-dynamic">RAM</div>
                <div class="size-h4">{{ printf "%.0f" $memPct }}%</div>
              </div>
            </div>

            {{/* NET */}}
            {{ $rxPct := div $netRx 1048576 }}{{ if gt $rxPct 100 }}{{ $rxPct = 100 }}{{ end }}
            {{ $txPct := div $netTx 1048576 }}{{ if gt $txPct 100 }}{{ $txPct = 100 }}{{ end }}
            <div class="stat-item">
              <div class="v-bars-row">
                <div class="v-bar-col">
                  <div class="v-bar-track">
                    <div class="v-bar-fill" style="height:{{ $rxPct }}%"></div>
                  </div>
                </div>
                <div class="v-bar-col">
                  <div class="v-bar-track">
                    <div class="v-bar-fill" style="height:{{ $txPct }}%"></div>
                  </div>
                </div>
              </div>
              <div class="size-h4 color-highlight">
                <div>↓{{ if gt $rxMB 0 }}{{ $rxMB }}MB{{ else if gt $rxKB 0 }}{{ $rxKB }}KB{{ else }}{{ $netRx }}B{{ end }}</div>
                <div>↑{{ if gt $txMB 0 }}{{ $txMB }}MB{{ else if gt $txKB 0 }}{{ $txKB }}KB{{ else }}{{ $netTx }}B{{ end }}</div>
              </div>
            </div>
      </div>

      {{/* ───── Диски ───── */}}
      {{ $diskPattern := .Options.StringOr "disk_mounts" "^/rootfs$" }}

      <div style="display:flex; flex-direction:column; gap:2px; padding-top:6px;">
        <div class="color-highlight size-h3">Disk</div>
        {{ range $fs.JSON.Array "" }}
        {{ $mnt := .String "mnt_point" }}
        {{ if findMatch $diskPattern $mnt }}

        {{ $pct     := .Float "percent" }}
        {{ $usedGB  := div (.Int "used")  1073741824 }}
        {{ $sizeGB  := div (.Int "size")  1073741824 }}
        {{ $devName := .String "device_name" }}

        {{ $readBytes  := 0 }}
        {{ $writeBytes := 0 }}
        {{ range $diskio.JSON.Array "" }}
          {{ $dname := .String "disk_name" }}
          {{ if findMatch (printf "/dev/%s" $dname) $devName }}
            {{ $readBytes  = .Int "read_bytes_rate_per_sec" }}
            {{ $writeBytes = .Int "write_bytes_rate_per_sec" }}
          {{ end }}
        {{ end }}

        {{ $readMB  := div $readBytes  1048576 }}
        {{ $writeMB := div $writeBytes 1048576 }}
        {{ $readKB  := div $readBytes  1024 }}
        {{ $writeKB := div $writeBytes 1024 }}

        <div data-popover-type="html" data-popover-margin="0.3rem" data-popover-max-width="180px"
             style="display:flex; align-items:center; gap:8px; cursor:default;">

          <div data-popover-html="">
            <div class="size-h5 color-highlight">{{ $mnt }}</div>
            <div class="flex margin-top-3">
              <div class="size-h5">Used</div>
              <div class="value-separator"></div>
              <div class="color-highlight">{{ $usedGB }} / {{ $sizeGB }} GB</div>
            </div>
            <div class="flex margin-top-3">
              <div class="size-h5">Read</div>
              <div class="value-separator"></div>
              <div class="color-highlight">{{ if gt $readMB 0 }}{{ $readMB }}MB/s{{ else if gt $readKB 0 }}{{ $readKB }}KB/s{{ else }}—{{ end }}</div>
            </div>
            <div class="flex margin-top-3">
              <div class="size-h5">Write</div>
              <div class="value-separator"></div>
              <div class="color-highlight">{{ if gt $writeMB 0 }}{{ $writeMB }}MB/s{{ else if gt $writeKB 0 }}{{ $writeKB }}KB/s{{ else }}—{{ end }}</div>
            </div>
          </div>

          {{/* Название */}}
          <div class="size-h5" style="width:65px; flex-shrink:0; text-align:left; white-space:nowrap;">{{ $mnt }}</div>

          {{/* Горизонтальный бар */}}
          <div style="flex:1; height: 1.5rem; background:var(--color-bg-alt); border-radius:3px; overflow:hidden; border:1px solid var(--color-progress-border);">
            <div style="height:100%; width:{{ printf "%.0f" $pct }}%;
                        background-color: var(--color-progress-value);;
                        border-radius:3px;"></div>
          </div>

          {{/* Процент */}}
          <div class="size-h5 color-highlight" style="width:28px; flex-shrink:0; text-align:right;">{{ printf "%.0f" $pct }}%</div>

        </div>

        {{ end }}
        {{ end }}

      </div>


    </div>
    </div>


